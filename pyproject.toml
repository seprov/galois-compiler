[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galois-irgl-compiler"
version = "0.1.0"
description = "Python 3 compatibility port of the Galois IrGL GPU compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cgen>=2025.1,<2026", "pycparser==2.22", "toposort>=1.10,<2"]

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["src/ggc"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gg*"]
